<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#635BFF">
<title>Package pickup · Entrega de paquete</title>
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#F5F6FB;--surface:#FFFFFF;--surface-2:#F2F3F9;--line:#E3E6EF;--ink:#0F172A;--ink-2:#475569;--ink-3:#8A94A6;
  --accent:#635BFF;--accent-ink:#FFFFFF;--accent-soft:#EEEDFF;--ok:#059669;--ok-soft:#E3F7EF;--bad:#E0383E;--bad-soft:#FDECEC;
  --grad:linear-gradient(135deg,#635BFF 0%,#3B82F6 100%);--pen:#0F172A;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0F172A;--surface:#141E33;--surface-2:#1B2640;--line:#26324D;--ink:#F1F5F9;--ink-2:#AEB8CB;--ink-3:#7D88A1;
  --accent:#7D76FF;--accent-soft:#252457;--ok:#34D399;--ok-soft:#0F2F27;--bad:#FF6B6F;--bad-soft:#3A1719;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0)) env(safe-area-inset-bottom,0) max(16px,env(safe-area-inset-left,0))}
button,input{font:inherit;color:inherit}
main{max-width:480px;margin:0 auto;padding:14px 0 32px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--grad);display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:20px;height:20px}
.brand{font-weight:800;font-size:17px;letter-spacing:-.01em;flex:1;min-width:0}
.brand small{display:block;font-weight:500;font-size:13px;color:var(--ink-3)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:3px;flex:none}
.lang button{border:0;background:none;border-radius:999px;padding:7px 13px;font-weight:700;font-size:14px;color:var(--ink-2);min-height:36px}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px}
h1{font-size:24px;line-height:1.2;margin:0 0 4px;letter-spacing:-.01em}
.lead{margin:0 0 16px;color:var(--ink-2)}
.pkg{background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.pkg b{display:block;font-size:19px}
.pkg span{color:var(--ink-2);font-size:15px}
.f{margin-bottom:16px}
label.l{display:block;font-weight:700;font-size:15px;margin-bottom:7px}
.f input{width:100%;min-height:54px;border:2px solid var(--line);background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:18px}
.f input:focus{outline:none;border-color:var(--accent);background:var(--surface)}
.f input[aria-invalid="true"]{border-color:var(--bad)}
.padwrap{position:relative;border:2px dashed var(--line);border-radius:14px;background:#fff;touch-action:none}
.padwrap.bad{border-color:var(--bad)}
.padwrap canvas{display:block;width:100%;height:190px;border-radius:12px;touch-action:none}
.padhint{position:absolute;left:0;right:0;bottom:12px;text-align:center;color:#8A94A6;font-size:14px;pointer-events:none}
.padrow{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.clear{border:0;background:none;color:var(--accent);font-weight:700;padding:8px 2px;min-height:40px;cursor:pointer}
.err{color:var(--bad);font-size:15px;margin-top:6px;font-weight:600}
.go{width:100%;min-height:58px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:19px;cursor:pointer;margin-top:6px}
.go[disabled]{opacity:.6;cursor:default}
.formerr{background:var(--bad-soft);color:var(--bad);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px;margin-bottom:12px}
.done{text-align:center;padding:34px 18px}
.big{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px}
.big.ok{background:var(--ok-soft);color:var(--ok)}
.big.no{background:var(--bad-soft);color:var(--bad)}
.big svg{width:40px;height:40px}
.done p{color:var(--ink-2);margin:6px 0 0}
.foot{text-align:center;color:var(--ink-3);font-size:13px;margin-top:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="top">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8"/></svg></span>
    <div class="brand" id="brand"></div>
    <div class="lang" role="group" aria-label="Language / Idioma"><button type="button" data-lang="en">EN</button><button type="button" data-lang="es">ES</button></div>
  </div>

  <p class="card" id="loading" aria-live="polite"></p>

  <form class="card" id="form" novalidate hidden>
    <h1 id="t-title"></h1>
    <p class="lead" id="t-lead"></p>
    <div class="pkg" id="pkg"></div>
    <div class="formerr" id="formErr" role="alert" hidden></div>
    <div class="f"><label class="l" for="name" id="t-name"></label><input id="name" autocomplete="name" autocapitalize="words" maxlength="120" enterkeyhint="done"><div class="err" id="e-name" hidden></div></div>
    <label class="l" id="t-sign"></label>
    <div class="padwrap" id="padwrap"><canvas id="pad" aria-labelledby="t-sign"></canvas><div class="padhint" id="t-hint"></div></div>
    <div class="padrow"><div class="err" id="e-sign" hidden style="margin:0"></div><span></span><button type="button" class="clear" id="clear"></button></div>
    <button class="go" type="submit" id="go"></button>
  </form>

  <section class="card done" id="done" hidden aria-live="polite">
    <div class="big ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h1 id="t-thanks"></h1>
    <p id="t-thanks2"></p>
  </section>

  <section class="card done" id="bad" hidden aria-live="polite">
    <div class="big no"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg></div>
    <h1 id="t-badT"></h1>
    <p id="t-badP"></p>
  </section>
  <p class="foot" id="t-foot"></p>
</main>
<script>
(() => {
'use strict';
const API = 'https://ilqlluhsyxlwersrnmob.supabase.co';
const KEY = 'sb_publishable_FGX3oLS67ifrHc1CUGkmPQ_s338NdmZ';
const T = {
  en: {title: 'Sign for your package', lead: 'Write your name and sign with your finger to confirm you picked it up.', pkgFor: 'Package for ',
    name: 'Your full name', sign: 'Your signature', hint: 'Sign here with your finger', clear: 'Clear', go: 'Confirm pickup', sending: 'Sending…',
    thanks: 'Thank you! All done', thanks2: 'The front desk has your signature. You can close this page.', loading: 'Loading…',
    badT: 'This link no longer works', badP: 'It was already used or it expired. Ask the front desk for a new QR.',
    foot: 'Your connection is secure (HTTPS). Your signature is only used as proof that you received this package.',
    eName: 'Write your full name.', eSign: 'Please sign in the box.', eNet: 'We couldn’t send it. Check your connection and try again.', eGeneric: 'Something went wrong. Please ask the front desk.'},
  es: {title: 'Firma para recibir tu paquete', lead: 'Escribe tu nombre y firma con el dedo para confirmar que lo recibiste.', pkgFor: 'Paquete para ',
    name: 'Tu nombre completo', sign: 'Tu firma', hint: 'Firma aquí con el dedo', clear: 'Borrar', go: 'Confirmar entrega', sending: 'Enviando…',
    thanks: '¡Gracias! Listo', thanks2: 'Recepción ya tiene tu firma. Puedes cerrar esta página.', loading: 'Cargando…',
    badT: 'Este enlace ya no funciona', badP: 'Ya se usó o venció. Pide un QR nuevo en recepción.',
    foot: 'Tu conexión es segura (HTTPS). Tu firma solo se usa como comprobante de que recibiste este paquete.',
    eName: 'Escribe tu nombre completo.', eSign: 'Firma dentro del recuadro.', eNet: 'No se pudo enviar. Revisa tu conexión e inténtalo otra vez.', eGeneric: 'Algo salió mal. Pide ayuda en recepción.'},
};
const $ = s => document.querySelector(s);
const q = new URLSearchParams(location.search);
const tok = String(q.get('t') || '').toLowerCase();
const store = {get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k, v){ try { localStorage.setItem(k, v); } catch {} }};
let lang = q.get('lang') === 'en' || q.get('lang') === 'es' ? q.get('lang') : store.get('gq.lang') || (/^es\b/i.test(navigator.language || '') ? 'es' : 'en');
let info = null, busy = false, inked = false;
const t = k => T[lang][k];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);

async function rpc(fn, args){
  const ctl = 'AbortController' in window ? new AbortController() : null, tm = setTimeout(() => ctl && ctl.abort(), 20000);
  try {
    const r = await fetch(API + '/rest/v1/rpc/' + fn, {method: 'POST', signal: ctl ? ctl.signal : undefined,
      headers: {'Content-Type': 'application/json', apikey: KEY}, body: JSON.stringify(args)});
    let j = null; try { j = await r.json(); } catch {}
    if (!r.ok) { const e = new Error((j && j.message) || 'ERROR'); e.server = true; throw e; }
    return j;
  } finally { clearTimeout(tm); }
}
function paint(){
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  ['title', 'lead', 'name', 'sign', 'hint', 'thanks', 'thanks2', 'badT', 'badP', 'foot'].forEach(k => { const el = $('#t-' + k); if (el) el.textContent = t(k); });
  $('#clear').textContent = t('clear');
  $('#go').textContent = busy ? t('sending') : t('go');
  $('#loading').textContent = t('loading');
  $('#brand').innerHTML = esc(info ? info.hotel : 'FrankShift') + '<small>' + esc(t('title')) + '</small>';
  if (info) $('#pkg').innerHTML = `<b>${esc(t('pkgFor') + info.recipient)}</b><span>${esc(info.carrier === 'Other' ? '' : info.carrier)}${info.tail ? (info.carrier === 'Other' ? '' : ' · ') + '••••' + esc(info.tail) : ''}</span>`;
  $('#t-hint').hidden = inked;
  document.querySelectorAll('.err:not([hidden]), .formerr:not([hidden])').forEach(e => { if (e.dataset.k) e.textContent = t(e.dataset.k); });
}
function err(id, k){ const e = $(id); e.hidden = !k; e.dataset.k = k || ''; e.textContent = k ? t(k) : ''; }
function showBad(){ $('#loading').hidden = true; $('#form').hidden = true; $('#done').hidden = true; $('#bad').hidden = false; }

// the signature pad: finger or mouse, drawn at the screen's pixel density
const pad = $('#pad'), ctx = pad.getContext('2d');
function padSize(){
  const r = pad.getBoundingClientRect(), d = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
  const keep = inked ? pad.toDataURL() : null;
  pad.width = Math.max(1, Math.round(r.width * d)); pad.height = Math.max(1, Math.round(r.height * d));
  ctx.setTransform(d, 0, 0, d, 0, 0); ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0F172A';
  if (keep) { const img = new Image(); img.onload = () => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(img, 0, 0, pad.width, pad.height); ctx.restore(); }; img.src = keep; }
}
let last = null;
const pt = e => { const r = pad.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; };
pad.addEventListener('pointerdown', e => { e.preventDefault(); try { pad.setPointerCapture(e.pointerId); } catch {} last = pt(e); ctx.beginPath(); ctx.arc(last.x, last.y, 1.2, 0, Math.PI * 2); ctx.fillStyle = '#0F172A'; ctx.fill(); });
pad.addEventListener('pointermove', e => { if (!last) return; e.preventDefault(); const p = pt(e); ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
  if (!inked) { inked = true; $('#t-hint').hidden = true; $('#padwrap').classList.remove('bad'); err('#e-sign', ''); } });
const up = () => { last = null; };
pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up); pad.addEventListener('pointerleave', up);
$('#clear').onclick = () => { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, pad.width, pad.height); ctx.restore(); inked = false; $('#t-hint').hidden = false; };
// a white, smaller copy keeps the saved signature light (well under the server's limit)
function sigData(){
  const w = Math.min(600, pad.width), h = Math.round(pad.height * w / pad.width), c = document.createElement('canvas');
  c.width = w; c.height = h; const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(pad, 0, 0, w, h);
  return c.toDataURL('image/png');
}

$('#form').addEventListener('submit', async e => {
  e.preventDefault(); if (busy) return; err('#formErr', '');
  const name = $('#name').value.replace(/\s+/g, ' ').trim();
  err('#e-name', name.length >= 2 ? '' : 'eName'); $('#name').setAttribute('aria-invalid', name.length >= 2 ? 'false' : 'true');
  err('#e-sign', inked ? '' : 'eSign'); $('#padwrap').classList.toggle('bad', !inked);
  if (name.length < 2) { $('#name').focus(); return; }
  if (!inked) { if (pad.scrollIntoView) pad.scrollIntoView({block: 'center', behavior: 'smooth'}); return; }
  busy = true; $('#go').disabled = true; $('#go').textContent = t('sending');
  try {
    await rpc('pk_sign', {p_t: tok, p_name: name, p_signature: sigData()});
    $('#form').hidden = true; $('#done').hidden = false; window.scrollTo(0, 0);
  } catch (x) {
    const m = x.message;
    if (m === 'BAD_LINK') showBad();
    else if (m === 'BAD_NAME') { err('#e-name', 'eName'); $('#name').focus(); }
    else if (m === 'NO_SIGNATURE') err('#e-sign', 'eSign');
    else err('#formErr', x.server ? 'eGeneric' : 'eNet');
  } finally { busy = false; $('#go').disabled = false; $('#go').textContent = t('go'); }
});
document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; store.set('gq.lang', lang); paint(); });
$('#name').addEventListener('input', () => err('#e-name', ''));
window.addEventListener('resize', () => { if (!$('#form').hidden) padSize(); });

paint();
(async () => {
  if (!/^[0-9a-f]{48}$/.test(tok)) { showBad(); return; }
  try { info = await rpc('pk_sign_info', {p_t: tok}); }
  catch (x) { if (x.message === 'BAD_LINK') { showBad(); return; } $('#loading').textContent = t('eNet'); return; }
  $('#loading').hidden = true; $('#form').hidden = false; paint(); padSize();
})();
})();
</script>
</body>
</html>
